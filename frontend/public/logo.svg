<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern cloud storage inspired logo for Hypz -->
  <defs>
    <linearGradient id="hypzGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer hexagon with gradient -->
  <path d="M256 32L432 128V288L256 384L80 288V128L256 32Z" fill="url(#hypzGradient)" opacity="0.2"/>
  <path d="M256 32L432 128V288L256 384L80 288V128L256 32Z" stroke="url(#hypzGradient)" stroke-width="8" fill="none"/>
  
  <!-- Letter H stylized as cloud storage -->
  <g>
    <!-- Left vertical bar of H -->
    <rect x="140" y="140" width="40" height="232" rx="8" fill="url(#hypzGradient)"/>
    
    <!-- Right vertical bar of H -->
    <rect x="332" y="140" width="40" height="232" rx="8" fill="url(#hypzGradient)"/>
    
    <!-- Middle horizontal bar of H with cloud storage icon -->
    <rect x="140" y="236" width="232" height="40" rx="8" fill="url(#hypzGradient)"/>
    
    <!-- Storage layers inside the middle bar -->
    <circle cx="256" cy="256" r="48" fill="white" opacity="0.3"/>
    <circle cx="256" cy="256" r="32" fill="white" opacity="0.5"/>
    <circle cx="256" cy="256" r="16" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Abstract data flow particles -->
  <circle cx="200" cy="100" r="6" fill="url(#hypzGradient)" opacity="0.6"/>
  <circle cx="312" cy="100" r="6" fill="url(#hypzGradient)" opacity="0.6"/>
  <circle cx="200" cy="412" r="6" fill="url(#hypzGradient)" opacity="0.6"/>
  <circle cx="312" cy="412" r="6" fill="url(#hypzGradient)" opacity="0.6"/>
</svg>
