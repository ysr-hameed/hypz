<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.1">
    <path d="M0 0 L1200 0 L1200 630 L0 630 Z" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="157.5" x2="1200" y2="157.5" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5" stroke="#3B82F6" stroke-width="1"/>
  </g>
  
  <!-- Logo -->
  <g transform="translate(150, 165)">
    <path d="M100 10L200 60V160L100 210L0 160V60L100 10Z" fill="url(#logoGradient)" opacity="0.2" filter="url(#glow)"/>
    <path d="M100 10L200 60V160L100 210L0 160V60L100 10Z" stroke="url(#logoGradient)" stroke-width="4" fill="none" filter="url(#glow)"/>
    <rect x="45" y="65" width="20" height="90" rx="4" fill="url(#logoGradient)"/>
    <rect x="135" y="65" width="20" height="90" rx="4" fill="url(#logoGradient)"/>
    <rect x="45" y="100" width="110" height="20" rx="4" fill="url(#logoGradient)"/>
    <circle cx="100" cy="110" r="20" fill="#1e293b" opacity="0.5"/>
    <circle cx="100" cy="110" r="13" fill="#1e293b" opacity="0.7"/>
    <circle cx="100" cy="110" r="6" fill="#60A5FA" opacity="0.9"/>
  </g>
  
  <!-- Brand Name -->
  <text x="400" y="280" font-family="'Poppins', sans-serif" font-size="96" font-weight="800" fill="white">
    Hypz
  </text>
  
  <!-- Tagline -->
  <text x="400" y="340" font-family="'Poppins', sans-serif" font-size="36" font-weight="500" fill="#94a3b8">
    Modern Object Storage
  </text>
  
  <!-- Features -->
  <g transform="translate(400, 380)">
    <text y="0" font-family="'Poppins', sans-serif" font-size="24" font-weight="400" fill="#60A5FA">
      ✓ Secure &amp; Scalable
    </text>
    <text y="45" font-family="'Poppins', sans-serif" font-size="24" font-weight="400" fill="#A78BFA">
      ✓ S3-Compatible API
    </text>
    <text y="90" font-family="'Poppins', sans-serif" font-size="24" font-weight="400" fill="#F472B6">
      ✓ Cost-Effective Storage
    </text>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="60" fill="url(#logoGradient)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="40" fill="url(#logoGradient)" opacity="0.1" filter="url(#glow)"/>
  <circle cx="100" cy="550" r="30" fill="url(#logoGradient)" opacity="0.1" filter="url(#glow)"/>
</svg>
